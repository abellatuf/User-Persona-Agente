# Corre las pruebas del agente en cada cambio. No usa secretos ni modelos.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
